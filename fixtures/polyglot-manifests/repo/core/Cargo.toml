[package]
name = "polyglot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = "1.40"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "polyglot-cli"
path = "src/bin/cli.rs"
